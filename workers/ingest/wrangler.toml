name = "anipotts-ingest"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0f856093bdcd34a7da1bde5ee4385163"
main = "src/index.ts"
workers_dev = true

# Secrets: MAC_MINI_INGEST_KEY and BRANDS_INGEST_KEY.
# GITHUB_TOKEN and CF_API_TOKEN may still be set in Cloudflare. No code reads
# them since the cron jobs were retired on 2026-09-22. Removing them is Ani's
# call.

# Keep this block. An explicit empty list removes the old every-minute
# "* * * * *" schedule on deploy. wrangler 4.x sends the schedules PUT only
# when crons is set, so deleting the block would leave that trigger live.
[triggers]
crons = []

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"

# Workers Logs keep the once-per-isolate runtime contract line (names and
# states only). Invocation logs stay off: they record request headers and
# client metadata, and credential header redaction is heuristic.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
