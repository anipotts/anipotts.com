name = "anipotts-weekly-email"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0f856093bdcd34a7da1bde5ee4385163"
main = "src/index.ts"
workers_dev = true

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"

# Secrets: RESEND_API_KEY and MINI_API_KEY.
# Secrets: MERCURY_API_TOKEN, MERCURY_ACCOUNT_ID_CHECKING and MERCURY_ACCOUNT_ID_SAVINGS.
# MINI_API_URL falls back to https://api.mini.anipotts.com in code when unset.
# Optional secrets: MINI_API_URL.

# Sunday 9am EDT = 13:00 UTC (during DST, arrives 8am EST in winter)
# DST covers ~8 months of the year, so optimizing for EDT
[triggers]
crons = ["0 13 * * SUN"]

# Workers Logs keep the once-per-isolate runtime contract line (names and
# states only). Invocation logs stay off: they record request headers and
# client metadata, and credential header redaction is heuristic.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
