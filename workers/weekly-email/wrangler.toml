name = "anipotts-weekly-email"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0f856093bdcd34a7da1bde5ee4385163"
main = "src/index.ts"
workers_dev = true

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"

# Retired on 2026-09-22: the worker sends nothing and reads no secret.
# RESEND_API_KEY, MINI_API_KEY, MINI_API_URL, MERCURY_API_TOKEN,
# MERCURY_ACCOUNT_ID_CHECKING and MERCURY_ACCOUNT_ID_SAVINGS may still be set
# in Cloudflare. Removing them is Ani's call.

# Keep this block. An explicit empty list removes the old Sunday
# "0 13 * * SUN" schedule on deploy. wrangler 4.x sends the schedules PUT only
# when crons is set, so deleting the block would leave that trigger live.
[triggers]
crons = []

# Workers Logs keep the once-per-isolate runtime contract line (names and
# states only). Invocation logs stay off: they record request headers and
# client metadata, and credential header redaction is heuristic.
[observability]
enabled = true

[observability.logs]
invocation_logs = false
