# Dependabot config: minimize PR noise and batch scheduled updates.
#
# Strategy:
#   - npm: weekly Monday morning, grouped by update-type. Security updates still
#     open immediately (dependabot doesn't honor `schedule` for security).
#   - github-actions: monthly, low traffic.
#   - open-pull-requests-limit caps the queue so a quiet week doesn't pile up.
#
# Dependency PRs follow the normal protected CI and Security Review path.
# The website task maintains candidates and enables native auto-merge after review.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-patches:
        dependency-type: "production"
        update-types:
          - "patch"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
