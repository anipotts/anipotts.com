# Dependabot config: minimize PR noise and batch scheduled updates.
#
# Strategy:
#   - npm: weekly Monday morning, compatibility families first. Security updates still
#     open immediately (dependabot doesn't honor `schedule` for security).
#   - github-actions: monthly, low traffic.
#   - open-pull-requests-limit caps the queue so a quiet week doesn't pile up.
#
# Dependency PRs follow the normal protected CI and Security Review path.
# Patch, minor and security updates auto-merge through
# .github/workflows/dependabot-automerge.yml once the strict required checks
# pass on the exact head. Majors and unknown update types wait for Ani.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    # Node declarations follow the deployed/check runtime; major upgrades need
    # the matching runtime change rather than an isolated types-only PR.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The Astryx family ships an exact Core peer and a pnpm patch pinned to
      # core@0.7.1, so it moves only as one qualified migration, not a routine
      # bump. Without this, every weekly group fails the compatibility test.
      - dependency-name: "@astryxdesign/*"
    groups:
      react-family:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      astro-cloudflare:
        patterns: ["astro", "@astrojs/*", "@cloudflare/*", "wrangler"]
      astryx-family:
        patterns: ["@astryxdesign/*"]
      browser-tools:
        patterns: ["e2e", "@e2e-dev/*", "playwright", "@playwright/*"]
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-patches:
        dependency-type: "production"
        update-types:
          - "patch"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
