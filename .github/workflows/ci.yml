name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify release
    runs-on: ubuntu-latest
    outputs:
      www: ${{ steps.release.outputs.www }}
      admin: ${{ steps.release.outputs.admin }}
      docs_only: ${{ steps.release.outputs.docs_only }}
      d1_changed: ${{ steps.release.outputs.d1_changed }}
      migration_risk: ${{ steps.release.outputs.migration_risk }}
      migration_preflight_required: ${{ steps.release.outputs.migration_preflight_required }}
      ci_policy_changed: ${{ steps.release.outputs.ci_policy_changed }}
      local_dev_changed: ${{ steps.release.outputs.local_dev_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Classify exact pull request head
        id: release
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/release-files.txt"
          git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"
          git diff --name-status "origin/${{ github.event.pull_request.base.ref }}"...HEAD > "$files"
          node scripts/ci/release-policy.mjs "$files" "${{ github.event.pull_request.head.sha }}" | tee "$GITHUB_OUTPUT"

  ci:
    name: Build, lint, typecheck, test
    needs: [classify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify frozen editorial publication
        if: startsWith(github.event.pull_request.head.ref, 'codex/editorial-')
        env:
          PUBLISH_BASE: ${{ github.event.pull_request.base.sha }}
          PUBLISH_HEAD: ${{ github.event.pull_request.head.sha }}
          PUBLISH_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          [[ "$PUBLISH_BRANCH" =~ ^codex/editorial-[a-f0-9]{8}-([a-f0-9]{4}-){3}[a-f0-9]{12}$ ]] || exit 0
          verifier="$RUNNER_TEMP/editorial-publication.mjs"
          git show "$PUBLISH_BASE:scripts/ci/editorial-publication.mjs" > "$verifier"
          node "$verifier"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "pnpm"

      - name: Setup Bun
        if: github.event.pull_request.draft == false
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        if: github.event.pull_request.draft == false
        run: pnpm install --frozen-lockfile

      - name: Check draft diff
        if: github.event.pull_request.draft == true
        run: git diff --check "origin/${{ github.event.pull_request.base.ref }}"...HEAD

      - name: Validate formatting and path hygiene
        if: github.event.pull_request.draft == false
        run: pnpm format:check && pnpm test:path-hygiene

      - name: Validate CI and release policy
        if: github.event.pull_request.draft == false && needs.classify.outputs.ci_policy_changed == 'true'
        run: pnpm test:workspace && pnpm test:deploy-targets && pnpm test:workflows && pnpm test:security-review && pnpm test:release-policy && pnpm test:release-smoke

      - name: Validate local development
        if: github.event.pull_request.draft == false && needs.classify.outputs.local_dev_changed == 'true'
        run: pnpm test:admin-preview && pnpm test:portless-preview

      - name: Validate affected packages once
        if: github.event.pull_request.draft == false && needs.classify.outputs.docs_only != 'true'
        env:
          TURBO_SCM_BASE: origin/${{ github.event.pull_request.base.ref }}
          TURBO_SCM_HEAD: HEAD
        run: |
          pnpm turbo build --affected --output-logs=errors-only
          pnpm turbo lint --affected --output-logs=errors-only
          pnpm turbo typecheck --affected --output-logs=errors-only
          pnpm turbo test --affected --output-logs=errors-only

      - name: Validate public contracts
        if: github.event.pull_request.draft == false && needs.classify.outputs.www == 'true'
        run: pnpm test:public-boundary && pnpm test:public-routes && pnpm test:public-copy:policy && pnpm content:check

      - name: Validate Admin contracts
        if: github.event.pull_request.draft == false && needs.classify.outputs.admin == 'true'
        run: pnpm test:admin-routes && pnpm test:admin-fixture-boundary

      - name: Validate migration inventory and replay
        if: github.event.pull_request.draft == false && needs.classify.outputs.migration_preflight_required == 'true'
        run: pnpm test:d1-bootstrap && pnpm test:migration-local && pnpm test:site-migrations
