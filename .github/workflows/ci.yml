name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify release
    runs-on: ubuntu-latest
    outputs:
      approval_required: ${{ steps.release.outputs.approval_required }}
      d1_changed: ${{ steps.release.outputs.d1_changed }}
      migration_risk: ${{ steps.release.outputs.migration_risk }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Classify exact pull request head
        id: release
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/release-files.txt"
          git fetch --no-tags --prune origin "${{ github.event.pull_request.base.ref }}"
          git diff --name-status "origin/${{ github.event.pull_request.base.ref }}"...HEAD > "$files"
          node scripts/ci/release-policy.mjs "$files" "${{ github.event.pull_request.head.sha }}" | tee "$GITHUB_OUTPUT"

  ci:
    name: Build, lint, typecheck, test
    needs: [classify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate workspace inventory
        run: pnpm test:workspace

      - name: Validate deploy target rules
        run: pnpm test:deploy-targets

      - name: Validate admin route parity
        run: pnpm test:admin-routes

      - name: Validate public app boundary
        run: pnpm test:public-boundary

      - name: Validate public route smoke parity
        run: pnpm test:public-routes

      - name: Validate active path hygiene
        run: pnpm test:path-hygiene

      - name: Validate content platform invariants
        run: pnpm test:content-platform

      - name: Validate workflow inventory
        run: pnpm test:workflows

      - name: Validate security review rules
        run: pnpm test:security-review

      - name: Validate release policy
        run: pnpm test:release-policy

      - name: Validate formatting
        run: pnpm format:check

      - name: Validate affected packages
        env:
          TURBO_SCM_BASE: origin/${{ github.event.pull_request.base.ref }}
          TURBO_SCM_HEAD: HEAD
        run: |
          pnpm turbo build --affected --output-logs=errors-only
          pnpm turbo lint --affected --output-logs=errors-only
          pnpm turbo typecheck --affected --output-logs=errors-only
          pnpm turbo test --affected --output-logs=errors-only

  migration-preflight:
    name: Migration Preflight
    needs: [classify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify immutable migration inventory
        run: node scripts/ci/migration-policy.mjs

      - name: Prove additive migration replay locally
        run: pnpm test:migration-local

      - name: Report remote promotion gate
        if: needs.classify.outputs.d1_changed == 'true'
        run: |
          echo "migration_risk=${{ needs.classify.outputs.migration_risk }}"
          echo "remote migration promotion remains gated by the verified bootstrap receipt"
