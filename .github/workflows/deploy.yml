# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN    - Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID   - 0f856093bdcd34a7da1bde5ee4385163
#   ADMIN_PASSWORD          - Admin UI password
#   RESEND_API_KEY          - Resend API key for newsletter worker deployments
#   NEWSLETTER_MAILING_ADDRESS - Physical mailing address for newsletter issue footers
#   TYPEFULLY_API_KEY       - Typefully API key
#   TYPEFULLY_SOCIAL_SET_ID - Typefully social set ID
#
# Path-filtered deploys: each retained production job only runs when files
# relevant to that target actually changed. Root dependency changes do not
# fan out to every target; use workflow_dispatch for an explicit deploy when a
# root-only change needs promotion. Documentation-only commits skip the workflow
# through the explicit paths below. Canonical public Markdown remains deployable.
# Workflow-only changes run detection but deploy nothing. No
# untrusted input is interpolated into run: blocks anywhere here.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "exact main commit approved for manual deployment"
        required: true
        type: string
      www:
        description: "deploy anipotts.com"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      admin:
        description: "deploy admin.anipotts.com"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      ingest:
        description: "deploy ingest worker"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      newsletter:
        description: "deploy newsletter worker"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      state:
        description: "deploy state worker"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      weekly_email:
        description: "deploy weekly email worker"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate exact release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      www: ${{ steps.release.outputs.www || 'false' }}
      admin: ${{ steps.release.outputs.admin || 'false' }}
      ingest: ${{ steps.release.outputs.ingest || 'false' }}
      newsletter: ${{ steps.release.outputs.newsletter || 'false' }}
      state: ${{ steps.release.outputs.state || 'false' }}
      weekly_email: ${{ steps.release.outputs.weekly_email || 'false' }}
      d1_changed: ${{ steps.release.outputs.d1_changed || 'false' }}
      migration_risk: ${{ steps.release.outputs.migration_risk || 'none' }}
      remote_migration_allowed: ${{ steps.release.outputs.remote_migration_allowed || 'false' }}
      release_id: ${{ steps.release.outputs.release_id }}
      database_schema_version: ${{ steps.release.outputs.database_schema_version }}
      migration_schema_before: ${{ steps.release.outputs.migration_schema_before }}
      migration_schema_after: ${{ steps.release.outputs.migration_schema_after }}
      production_enabled: ${{ steps.gates.outputs.production_enabled }}
      admin_enabled: ${{ steps.gates.outputs.admin_enabled }}
      app_rollback_enabled: ${{ steps.gates.outputs.app_rollback_enabled }}
      deployment_required: ${{ steps.release.outputs.deployment_required }}
      deployment_disposition: ${{ steps.release.outputs.deployment_disposition }}
      deployed_www_sha: ${{ steps.release.outputs.deployed_www_sha }}
      www_disposition: ${{ steps.release.outputs.www_disposition }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"

      - name: Verify exact main SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.ref }}" = "refs/heads/main"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ github.actor }}" = "anipotts"
            test "${{ inputs.source_sha }}" = "${{ github.sha }}"
          fi

      - name: Classify release
        id: release
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/deploy-changed-files.txt"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            : > "$files"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-status -r "${{ github.sha }}" > "$files"
          else
            git diff --name-status "${{ github.event.before }}" "${{ github.sha }}" > "$files"
          fi

          health="$RUNNER_TEMP/www-health.json"
          curl -fsS https://anipotts.com/api/health > "$health" || echo '{}' > "$health"
          node scripts/ci/deployment-plan.mjs "$files" "$health" "${{ github.sha }}" | tee "$GITHUB_OUTPUT"

      - name: Setup pnpm for D1
        if: steps.release.outputs.d1_changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: "10.5.2"

      - name: Install migration dependencies
        if: steps.release.outputs.d1_changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Read rollout gates
        id: gates
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const policy = require("./config/release-train.json");
          console.log(`production_enabled=${policy.production_promotion === "enabled"}`);
          console.log(`automatic_migrations_enabled=${policy.automatic_migrations === "enabled_safe_additive"}`);
          console.log(`admin_enabled=${policy.authenticated_admin_smoke === "enabled"}`);
          console.log(`app_rollback_enabled=${policy.automatic_app_rollback === "enabled"}`);
          NODE

      - name: Stop safely when automatic migration promotion is held
        if: steps.release.outputs.d1_changed == 'true' && (steps.release.outputs.remote_migration_allowed != 'true' || steps.gates.outputs.automatic_migrations_enabled != 'true')
        run: |
          echo "::error::automatic migration promotion is held by release policy or migration eligibility"
          exit 1

      - name: Reject production schema drift
        if: steps.gates.outputs.production_enabled == 'true' && steps.release.outputs.d1_changed == 'true'
        run: |
          result="$RUNNER_TEMP/production-schema.json"
          pnpm exec wrangler d1 execute anipotts-db --remote --config apps/admin/wrangler.toml --json --command "SELECT type, name, tbl_name, sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name" > "$result"
          node scripts/ci/d1-schema-fingerprint.mjs "$result" "${{ steps.release.outputs.migration_schema_before }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Capture D1 Time Travel bookmark
        if: steps.gates.outputs.production_enabled == 'true' && steps.release.outputs.d1_changed == 'true'
        run: pnpm exec wrangler d1 time-travel info anipotts-db --config apps/admin/wrangler.toml --json | tee "$RUNNER_TEMP/d1-bookmark.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify migration preconditions
        if: steps.gates.outputs.production_enabled == 'true' && steps.release.outputs.d1_changed == 'true'
        run: node scripts/ci/d1-migration-conditions.mjs preconditions all-pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply eligible D1 migrations
        if: steps.gates.outputs.production_enabled == 'true' && steps.release.outputs.d1_changed == 'true'
        run: pnpm exec wrangler d1 migrations apply anipotts-db --remote --config apps/admin/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify migration postconditions
        if: steps.gates.outputs.production_enabled == 'true' && steps.release.outputs.d1_changed == 'true'
        run: node scripts/ci/d1-migration-conditions.mjs postconditions all-pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify migrated schema fingerprint
        if: steps.gates.outputs.production_enabled == 'true' && steps.release.outputs.d1_changed == 'true'
        run: |
          result="$RUNNER_TEMP/migrated-production-schema.json"
          pnpm exec wrangler d1 execute anipotts-db --remote --config apps/admin/wrangler.toml --json --command "SELECT type, name, tbl_name, sql FROM sqlite_master WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name" > "$result"
          node scripts/ci/d1-schema-fingerprint.mjs "$result" "${{ steps.release.outputs.migration_schema_after }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record held promotion
        if: steps.gates.outputs.production_enabled != 'true'
        run: echo "production promotion is disabled by release policy"

  deploy-www:
    name: Deploy www
    needs: [release]
    if: >
      needs.release.outputs.production_enabled == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.www == 'true') ||
        (github.event_name == 'push' && needs.release.outputs.www == 'true')
      )
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build www (Astro)
        run: pnpm turbo build --filter=@anipotts/www
        env:
          PUBLIC_RELEASE_SHA: ${{ github.sha }}
          PUBLIC_RELEASE_SCHEMA_VERSION: ${{ needs.release.outputs.database_schema_version }}
          # Astro's static build bakes PUBLIC_* vars at build time. Add this
          # GitHub Actions secret to enable analytics.
          # Absent = those features no-op and the build still succeeds.
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}

      # apps/www is Astro (@astrojs/cloudflare). `astro build` already emits the
      # worker bundle at dist/_worker.js; no opennextjs adapter step here.
      - name: Capture active www version
        id: previous
        run: |
          node scripts/ci/worker-version.mjs capture apps/www/wrangler.toml >> "$GITHUB_OUTPUT"
          previous_sha="$(curl -fsS https://anipotts.com/api/health | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).release_sha||"unknown"))')"
          echo "previous_sha=${previous_sha}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: apps/www
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke exact www release
        id: smoke
        continue-on-error: true
        run: node scripts/ci/release-smoke.mjs --target www --base-url https://anipotts.com --expected-sha "${{ github.sha }}"

      - name: Restore previous www version after app-only smoke failure
        if: steps.smoke.outcome == 'failure' && needs.release.outputs.app_rollback_enabled == 'true' && needs.release.outputs.d1_changed != 'true'
        run: |
          node scripts/ci/worker-version.mjs rollback apps/www/wrangler.toml "${{ steps.previous.outputs.previous_version }}"
          if [ "${{ steps.previous.outputs.previous_sha }}" = "unknown" ]; then
            node scripts/ci/release-smoke.mjs --target www --base-url https://anipotts.com --allow-unversioned
          else
            node scripts/ci/release-smoke.mjs --target www --base-url https://anipotts.com --expected-sha "${{ steps.previous.outputs.previous_sha }}"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fail unsuccessful www release
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::www smoke failed; rollback state is recorded above"
          exit 1

  deploy-admin:
    name: Deploy admin
    needs: [release]
    if: >
      always() &&
      needs.release.outputs.production_enabled == 'true' &&
      needs.release.outputs.admin_enabled == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.admin == 'true') ||
        (github.event_name == 'push' && needs.release.outputs.admin == 'true')
      )
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin
        run: pnpm turbo build --filter=@anipotts/admin
        env:
          PUBLIC_RELEASE_SHA: ${{ github.sha }}
          PUBLIC_RELEASE_SCHEMA_VERSION: ${{ needs.release.outputs.database_schema_version }}

      - name: Verify read-only production smoke identity
        run: |
          test -n "$ADMIN_CI_ACCESS_CLIENT_ID"
          test -n "$ADMIN_CI_ACCESS_CLIENT_SECRET"
          test -n "$ADMIN_CI_READ_TOKEN"
        env:
          ADMIN_CI_ACCESS_CLIENT_ID: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_ID }}
          ADMIN_CI_ACCESS_CLIENT_SECRET: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_SECRET }}
          ADMIN_CI_READ_TOKEN: ${{ secrets.ADMIN_CI_READ_TOKEN }}

      - name: Capture active admin version
        id: previous
        run: |
          node scripts/ci/worker-version.mjs capture apps/admin/wrangler.toml >> "$GITHUB_OUTPUT"
          node scripts/ci/worker-version.mjs health https://admin.anipotts.com admin >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_CI_ACCESS_CLIENT_ID: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_ID }}
          ADMIN_CI_ACCESS_CLIENT_SECRET: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_SECRET }}
          ADMIN_CI_READ_TOKEN: ${{ secrets.ADMIN_CI_READ_TOKEN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: apps/admin
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke admin access boundary
        id: boundary_smoke
        continue-on-error: true
        run: node scripts/ci/release-smoke.mjs --target admin --mode unauthenticated --base-url https://admin.anipotts.com --expected-sha "${{ github.sha }}"
        env:
          ADMIN_CI_ACCESS_CLIENT_ID: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_ID }}
          ADMIN_CI_ACCESS_CLIENT_SECRET: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_SECRET }}
          ADMIN_CI_READ_TOKEN: ${{ secrets.ADMIN_CI_READ_TOKEN }}

      - name: Smoke admin read-only identity
        id: identity_smoke
        continue-on-error: true
        run: node scripts/ci/release-smoke.mjs --target admin --mode authenticated --base-url https://admin.anipotts.com --expected-sha "${{ github.sha }}"
        env:
          ADMIN_CI_ACCESS_CLIENT_ID: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_ID }}
          ADMIN_CI_ACCESS_CLIENT_SECRET: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_SECRET }}
          ADMIN_CI_READ_TOKEN: ${{ secrets.ADMIN_CI_READ_TOKEN }}

      - name: Restore previous admin version after app-only smoke failure
        if: (steps.boundary_smoke.outcome == 'failure' || steps.identity_smoke.outcome == 'failure') && needs.release.outputs.app_rollback_enabled == 'true' && needs.release.outputs.d1_changed != 'true'
        run: |
          node scripts/ci/worker-version.mjs rollback apps/admin/wrangler.toml "${{ steps.previous.outputs.previous_version }}"
          if [ "${{ steps.previous.outputs.previous_sha }}" = "unknown" ]; then
            node scripts/ci/release-smoke.mjs --target admin --mode unauthenticated --base-url https://admin.anipotts.com --allow-unversioned
          else
            node scripts/ci/release-smoke.mjs --target admin --mode unauthenticated --base-url https://admin.anipotts.com --expected-sha "${{ steps.previous.outputs.previous_sha }}"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_CI_ACCESS_CLIENT_ID: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_ID }}
          ADMIN_CI_ACCESS_CLIENT_SECRET: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_SECRET }}
          ADMIN_CI_READ_TOKEN: ${{ secrets.ADMIN_CI_READ_TOKEN }}

      - name: Fail unsuccessful admin release
        if: steps.boundary_smoke.outcome == 'failure' || steps.identity_smoke.outcome == 'failure'
        run: |
          echo "::error::admin smoke failed; rollback state is recorded above"
          exit 1

  deploy-ingest:
    name: Deploy ingest worker
    needs: [release]
    if: >
      needs.release.outputs.production_enabled == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.ingest == 'true') ||
        (github.event_name == 'push' && needs.release.outputs.ingest == 'true')
      )
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck ingest worker
        run: pnpm --filter @anipotts/ingest typecheck

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: workers/ingest
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-weekly-email:
    name: Deploy weekly email worker
    needs: [release]
    if: >
      needs.release.outputs.production_enabled == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.weekly_email == 'true') ||
        (github.event_name == 'push' && needs.release.outputs.weekly_email == 'true')
      )
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck weekly email worker
        run: pnpm --filter anipotts-weekly-email typecheck

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: workers/weekly-email
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-state:
    name: Deploy state worker
    needs: [release]
    if: >
      needs.release.outputs.production_enabled == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.state == 'true') ||
        (github.event_name == 'push' && needs.release.outputs.state == 'true')
      )
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck state worker
        run: pnpm turbo typecheck --filter=@anipotts/state

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          workingDirectory: workers/state
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-newsletter:
    name: Deploy newsletter worker
    needs: [release]
    if: >
      needs.release.outputs.production_enabled == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.newsletter == 'true') ||
        (github.event_name == 'push' && needs.release.outputs.newsletter == 'true')
      )
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck newsletter worker
        run: pnpm --filter @anipotts/newsletter-worker typecheck

      - name: Prepare newsletter secrets
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = process.env.NEWSLETTER_SECRETS_FILE;
          const secrets = {};
          if (!process.env.RESEND_API_KEY) {
            console.error("::error::RESEND_API_KEY GitHub secret is missing");
            process.exit(1);
          }
          secrets.RESEND_API_KEY = process.env.RESEND_API_KEY;
          if (process.env.NEWSLETTER_MAILING_ADDRESS) {
            secrets.NEWSLETTER_MAILING_ADDRESS = process.env.NEWSLETTER_MAILING_ADDRESS;
          } else {
            console.warn("::warning::NEWSLETTER_MAILING_ADDRESS is missing; issue sends will fail until it is set");
          }
          fs.writeFileSync(path, JSON.stringify(secrets));
          NODE
        env:
          NEWSLETTER_SECRETS_FILE: ${{ runner.temp }}/newsletter-secrets.json
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_MAILING_ADDRESS: ${{ secrets.NEWSLETTER_MAILING_ADDRESS }}

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler --cwd workers/newsletter deploy --keep-vars --secrets-file "$NEWSLETTER_SECRETS_FILE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEWSLETTER_SECRETS_FILE: ${{ runner.temp }}/newsletter-secrets.json

  release-summary:
    name: Release summary
    if: always()
    needs:
      - release
      - deploy-www
      - deploy-admin
      - deploy-ingest
      - deploy-weekly-email
      - deploy-state
      - deploy-newsletter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Publish immutable release receipt
        run: |
          {
            echo "## production release"
            echo
            echo "- release: \`${{ needs.release.outputs.release_id }}\`"
            echo "- source: \`${{ github.sha }}\`"
            echo "- disposition: \`${{ needs.release.outputs.deployment_disposition }}\`"
            echo "- production enabled: \`${{ needs.release.outputs.production_enabled }}\`"
            echo "- previous www source: \`${{ needs.release.outputs.deployed_www_sha }}\`"
            echo "- www source state: \`${{ needs.release.outputs.www_disposition }}\`"
            echo "- D1 changed: \`${{ needs.release.outputs.d1_changed }}\`"
            echo "- migration risk: \`${{ needs.release.outputs.migration_risk }}\`"
            echo "- schema version: \`${{ needs.release.outputs.database_schema_version }}\`"
            echo "- www: \`${{ needs.deploy-www.result }}\`"
            echo "- admin: \`${{ needs.deploy-admin.result }}\`"
            echo "- ingest: \`${{ needs.deploy-ingest.result }}\`"
            echo "- weekly email: \`${{ needs.deploy-weekly-email.result }}\`"
            echo "- state: \`${{ needs.deploy-state.result }}\`"
            echo "- newsletter: \`${{ needs.deploy-newsletter.result }}\`"
            echo
            echo "automatic D1 restore is disabled. migration failures stop the train."
          } >> "$GITHUB_STEP_SUMMARY"
