name = "anipotts-admin"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0f856093bdcd34a7da1bde5ee4385163"
main = "./dist/_worker.js/index.js"
workers_dev = false

# Canonical admin route. Editorial pages require the verified owner through
# Cloudflare Access; the existing single-owner policy is retained.
[[routes]]
pattern = "admin.anipotts.com"
custom_domain = true
zone_id = "d56476e2905a2a19ad86aaa4b7c719c2"

[assets]
binding = "ASSETS"
directory = "./dist"
run_worker_first = true

# Non-secret env vars available at runtime
[vars]
# Direct CMS publishing: one reviewed record per operation into CONTENT_DB,
# including unpublish. Rollback: set this back to "maintenance" and redeploy;
# accepted work stays durable and resumes or reconciles after the switch back.
EDITORIAL_PUBLISH_MODE = "direct"
PUBLIC_STATE_API = "https://api.anipotts.com"
ACCESS_TEAM_DOMAIN = "https://anipotts.cloudflareaccess.com"
ACCESS_POLICY_AUD = "ca3ea64cba714dee7d50eae63f62b18d6c2aeeecc0fc16ec0335ed0aa863a49f"
# Owner editing is enabled with the repository-only App and private Worker keys.
EDITORIAL_ENABLED = "true"
EDITORIAL_PUBLISH_ENABLED = "true"
EDITORIAL_GITHUB_APP_ID = "4879372"
EDITORIAL_GITHUB_INSTALLATION_ID = "160192316"
# Private reader credential issuance for the tailnet reader on ap-mini.
PRIVATE_READER_ENABLED = "true"
# Observability reads (ops:read) from the same tailnet reader.
PRIVATE_READER_OPS_ENABLED = "true"
# Secrets: EDITORIAL_GITHUB_PRIVATE_KEY and EDITORIAL_SIGNING_PRIVATE_KEY.
# The reader signing key is the PRIVATE_READER_SIGNING_KEY secret.

[[durable_objects.bindings]]
name = "EDITORIAL"
class_name = "EditorialDraftStore"

[[migrations]]
tag = "editorial-v1"
new_sqlite_classes = ["EditorialDraftStore"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"
migrations_dir = "../../drizzle/migrations"

# Workers Logs keep the once-per-isolate runtime contract line (names and
# states only). Invocation logs stay off: request URLs can carry recovery
# codes and owner filters, which logs must never retain.
# Dedicated published-content store and media. The public reader serves from
# it (CONTENT_RUNTIME = "cms"); the direct publisher writes to it.
[[d1_databases]]
binding = "CONTENT_DB"
database_name = "anipotts-content"
database_id = "2679fc97-e251-46b7-ad01-db8b9fe04e8d"

[[r2_buckets]]
binding = "CONTENT_MEDIA"
bucket_name = "anipotts-content-media"

[observability]
enabled = true

[observability.logs]
invocation_logs = false
