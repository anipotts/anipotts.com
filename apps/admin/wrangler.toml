name = "anipotts-admin"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0f856093bdcd34a7da1bde5ee4385163"
main = "./dist/_worker.js/index.js"
workers_dev = false

# Canonical admin route. Editorial pages require the verified owner through
# Cloudflare Access; provider cutover remains held until separately approved.
[[routes]]
pattern = "admin.anipotts.com"
custom_domain = true
zone_id = "d56476e2905a2a19ad86aaa4b7c719c2"

[assets]
binding = "ASSETS"
directory = "./dist"
run_worker_first = true

# Non-secret env vars available at runtime
[vars]
PUBLIC_STATE_API = "https://api.anipotts.com"
ACCESS_TEAM_DOMAIN = "https://anipotts.cloudflareaccess.com"
ACCESS_POLICY_AUD = "ca3ea64cba714dee7d50eae63f62b18d6c2aeeecc0fc16ec0335ed0aa863a49f"
# Activation is a separate reviewed configuration change after provider setup.
EDITORIAL_ENABLED = "false"
EDITORIAL_PUBLISH_ENABLED = "false"
EDITORIAL_GITHUB_APP_ID = ""
EDITORIAL_GITHUB_INSTALLATION_ID = ""
# Secrets: EDITORIAL_GITHUB_PRIVATE_KEY and EDITORIAL_SIGNING_PRIVATE_KEY.

[[durable_objects.bindings]]
name = "EDITORIAL"
class_name = "EditorialDraftStore"

[[migrations]]
tag = "editorial-v1"
new_sqlite_classes = ["EditorialDraftStore"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"
migrations_dir = "../../drizzle/migrations"

# Internal capability binding. The relay class is exported by anipotts-state;
# command submission never traverses a public HTTP route.
[[durable_objects.bindings]]
name = "COMMAND_RELAY"
class_name = "CommandRelay"
script_name = "anipotts-state"
