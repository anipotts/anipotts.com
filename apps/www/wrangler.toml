# Production worker for the astro public site. Serves the apex (anipotts.com) and
# staging.anipotts.com after the supervised cutover from the old Next.js worker.
# The pre-astro site is preserved at git tag v1-nextjs-monorepo plus the
# filesystem snapshot under ~/Archive; see docs/archive/version-history.md.
name = "anipotts-www-astro"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
main = "@astrojs/cloudflare/entrypoints/server"
workers_dev = true
account_id = "0f856093bdcd34a7da1bde5ee4385163"

[vars]
NEWSLETTER_BASE_URL = "https://news.anipotts.com"
NEWSLETTER_FROM = "Ani Potts <news@anipotts.com>"
NEWSLETTER_REPLY_TO = "contact@anipotts.com"

[[routes]]
pattern = "staging.anipotts.com"
custom_domain = true
zone_id = "d56476e2905a2a19ad86aaa4b7c719c2"

[[routes]]
pattern = "anipotts.com"
custom_domain = true
zone_id = "d56476e2905a2a19ad86aaa4b7c719c2"

[[routes]]
pattern = "news.anipotts.com"
custom_domain = true
zone_id = "d56476e2905a2a19ad86aaa4b7c719c2"

[assets]
binding = "ASSETS"
directory = "./dist"
# run the worker before assets so host-aware middleware can make
# news.anipotts.com/ canonical instead of serving the apex index.html.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"

[[queues.producers]]
binding = "NEWSLETTER_QUEUE"
queue = "newsletter-send"

[observability]
enabled = true
